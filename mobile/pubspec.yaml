name: jullius_scan
description: "Jullius Scan - Brazilian NFC-e fiscal receipt scanner"
publish_to: 'none'
version: 0.0.2+2
environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  http: ^1.3.0
  intl: ^0.20.2
  mobile_scanner: ^5.2.3
  webview_flutter: ^4.10.0
  webview_cookie_manager: ^2.0.6
  permission_handler: ^11.3.1
  firebase_crashlytics: ^4.3.10
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#009688"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  remove_alpha_ios: true
  background_color_ios: "#009688"

flutter_native_splash:
  color: "#009688"
  image: "assets/branding/splash_icon.png"
  android_12:
    color: "#009688"
    image: "assets/branding/splash_icon.png"
  android: true
  ios: true
