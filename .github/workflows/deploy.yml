name: Deploy Jullius Scan

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: registry.skadi.digital
  API_IMAGE: registry.skadi.digital/jullius-scan/api
  WORKER_IMAGE: registry.skadi.digital/jullius-scan/worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to private registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build API image
        run: |
          docker build \
            -f backend/Dockerfile.api \
            -t ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.API_IMAGE }}:latest \
            backend/

      - name: Build Worker image
        run: |
          docker build \
            -f backend/Dockerfile.worker \
            -t ${{ env.WORKER_IMAGE }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.WORKER_IMAGE }}:latest \
            backend/

      - name: Push images
        run: |
          docker push ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.API_IMAGE }}:latest
          docker push ${{ env.WORKER_IMAGE }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.WORKER_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync compose file to VPS
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/docker/jullius-scan"
          scp -i ~/.ssh/deploy_key.pem deploy/docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/docker/jullius-scan/docker-compose.yml

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY_SCRIPT'
            set -e

            DEPLOY_DIR="/opt/docker/jullius-scan"

            # Log in to registry on VPS
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

            # Pull new images
            docker pull ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}
            docker pull ${{ env.WORKER_IMAGE }}:${{ steps.tag.outputs.tag }}

            # Update IMAGE_TAG in .env
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ steps.tag.outputs.tag }}/' "$DEPLOY_DIR/.env"

            # Restart services
            cd "$DEPLOY_DIR"
            docker compose up -d --remove-orphans
          DEPLOY_SCRIPT
